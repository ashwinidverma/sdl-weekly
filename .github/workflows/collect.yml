name: 1 · Collect weekly candidates

on:
  schedule:
    - cron: "30 1 * * 1"   # every Monday 01:30 UTC (07:00 IST)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Collect candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect.py

      - name: Make sure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create draft      --color FBCA04 --description "Weekly draft waiting for curation" --force
          gh label create approved   --color 0E8A16 --description "Curated: publish this draft" --force
          gh label create published  --color 5319E7 --description "Newsletter generated" --force
          gh label create submission --color 1D76DB --description "Community submission" --force

      - name: Open draft issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh issue create --title "$(cat out/title.txt)" --body-file out/draft.md --label draft

      - name: Remember what was shown (avoids repeats next week)
        run: |
          git config user.name  "sdl-weekly-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git commit -m "Update seen items" || echo "Nothing to commit"
          git pull --rebase
          git push
